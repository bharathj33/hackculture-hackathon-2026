[project]
name = "storycritic-backend"
version = "0.1.0"
description = "StoryCritic — audience-swarm content critique backend (Pocket FM Zero to One hackathon)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9", # file uploads
    "httpx>=0.27", # MiroFish/ElevenLabs/OpenAI HTTP calls
    "openai>=1.35",
    "pyjwt>=2.8",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
media = [
    "elevenlabs>=1.5",           # Scribe v2 ASR+diarization (audio path)
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
